[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoxproof"
version = "0.1.0"
description = "Offline-verifiable, Ed25519-signed receipts for every AI agent tool call"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Quox" }]
keywords = ["ai", "agents", "verification", "audit", "receipts", "ed25519", "tool-calls"]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
quoxproof = "quoxproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
